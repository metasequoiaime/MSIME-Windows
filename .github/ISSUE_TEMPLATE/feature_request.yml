name: 功能建议 / Feature Request
description: 希望增加功能或改善体验？
title: "[Feat] "
labels: ["enhancement"]
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题与动机 / Problem & Motivation
      description: 说说你在什么情况下遇到不便，功能出发点是什么？Describe your situation and the difficulty.
      placeholder: |-
        例如：在高分辨率屏幕上打字时，候选字太小，看清后才能选字，打字容易中断。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 描述你希望达到的效果即可，不用设计实现方案。Describe the result you would like; an implementation plan is not needed.
      placeholder: 例如：希望能在设置里调大候选字，并立即看到调整效果。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 其他替代方案（可选） / Alternatives
      description: 你考虑过哪些其他做法？Any alternatives you considered?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 其他信息 / Additional Context
      description: 可附上参考输入法、截图、录屏或相关链接。
    validations:
      required: false
