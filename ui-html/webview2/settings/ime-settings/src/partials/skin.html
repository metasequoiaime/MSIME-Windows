<div class="content" id="skin-settings">
  <div class="content-header"><span>皮肤</span></div>

  <div class="section skin-theme-card" data-candidate-skin="fluent">
    <div class="skin-theme-header">
      <div>
        <div class="section-title" id="skinThemeTitle">Fluent 主题(Dark)</div>
        <div class="skin-theme-description" id="skinThemeStatus">当前默认主题</div>
      </div>
      <div class="skin-theme-actions">
        <div class="ftb-toggle-btn active skin-theme-toggle" data-skin-switch="fluent" role="switch" aria-checked="true" tabindex="0">
          <div class="ftb-toggle-knob"></div>
        </div>
        <button type="button" class="skin-preview-switch" data-skin-preview-switch title="切换明暗预览">预览浅色</button>
      </div>
    </div>

    <div class="skin-preview-list">
      <div class="skin-preview-row skin-preview-horizontal">
        <div class="skin-preview-stage"><div class="candidate wnd-h" data-skin-horizontal></div></div>
      </div>
      <div class="skin-preview-row skin-preview-vertical">
        <div class="skin-preview-stage"><div class="candidate wnd-v" data-skin-vertical></div></div>
      </div>
      <div class="skin-preview-row skin-preview-toolbar">
        <div class="skin-preview-stage"><div class="ftb-preview-host" data-skin-toolbar></div></div>
      </div>
    </div>
  </div>

  <div class="external-skin-heading">
    <div>
      <div class="section-title">外部皮肤</div>
      <div class="skin-theme-description">把包含 skin.toml 的皮肤文件夹复制到下面的目录，然后刷新。</div>
      <code id="externalSkinDirectory" class="external-skin-directory">%LOCALAPPDATA%\metasequoiaime\skins</code>
    </div>
    <div class="external-skin-actions">
      <button type="button" class="skin-preview-switch external-skin-refresh" id="openExternalSkinDirectory">打开目录</button>
