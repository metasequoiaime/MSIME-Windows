<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://msime-contracts; style-src 'unsafe-inline'; img-src data: https://appassets https://candidate-skins; font-src data: https://appassets https://candidate-skins">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(IME)horizontalCandidateWindow</title>
    <!-- Candidate layout and behavior are shared. The native host injects the selected built-in skin CSS here. -->

  <style>
    .cand .text { display: flex; align-items: baseline; }
    .cand-content { min-width: 0; }
    .cand-translation { display: block; font-size: 0.78em; line-height: 1.25; opacity: 0.62; }
  </style>
  <script src="https://msime-contracts/schema.js"></script>
  <script src="https://msime-contracts/runtime.js"></script>
  <script>const serializeHostMessage = message => MsimeProtocol.serializeClientMessage(message, "candidate");</script>
  <script>
    let lastPointerScreenPosition = null;
    let pointerProbeCount = 0;
    let currentRightClickedCand = null;
    let contextMenuTopExpansion = 0;
    let contextMenuLeftExpansion = 0;
    function positionContextMenu(menu, x, y) {
      menu.style.left = x + 'px'; menu.style.top = y + 'px';
      menu.style.visibility = 'hidden'; menu.style.display = 'block';
      const screenRight = window.screen.availLeft + window.screen.availWidth;
      const screenBottom = window.screen.availTop + window.screen.availHeight;
      const adjustedX = x - Math.max(0, window.screenX + x + menu.offsetWidth + 4 - screenRight);
      const adjustedY = y - Math.max(0, window.screenY + y + menu.offsetHeight + 4 - screenBottom);
      menu.style.left = Math.max(0, adjustedX) + 'px';
      menu.style.top = adjustedY + 'px';
      menu.style.visibility = '';
      return { x: Math.max(0, adjustedX), y: adjustedY, topExpansion: Math.max(0, 2 - adjustedY) };
    }
    function positionContextSubmenu(menu, menuY) {
      const parent = menu.querySelector('.context-menu-parent');
      const submenu = menu.querySelector('.context-submenu');
      if (!parent || !submenu) return { width: 80, height: 180, bottom: menuY + menu.offsetHeight };
      submenu.style.top = '-2px';
      submenu.style.visibility = 'hidden';
      submenu.style.display = 'block';
      const width = submenu.offsetWidth;
      const naturalHeight = submenu.offsetHeight;
      const menuX = Number.parseFloat(menu.style.left) || 0;
      const screenRight = window.screen.availLeft + window.screen.availWidth;
      const openLeft = window.screenX + menuX + menu.offsetWidth + width + 4 > screenRight;
      const leftExpansion = openLeft ? Math.max(0, width - menuX + 2) : 0;
      submenu.style.left = openLeft ? 'auto' : '100%';
      submenu.style.right = openLeft ? '100%' : 'auto';
      const defaultScreenTop = window.screenY + menuY + parent.offsetTop - 2;
      const screenBottom = window.screen.availTop + window.screen.availHeight;
      const targetScreenTop = Math.max(window.screen.availTop + 4,
        Math.min(defaultScreenTop, screenBottom - naturalHeight - 4));
      const topExpansion = Math.max(0, window.screenY + 2 - targetScreenTop);
      submenu.style.top = (targetScreenTop - window.screenY - menuY - parent.offsetTop) + 'px';
      const height = submenu.offsetHeight;
      submenu.style.display = '';
      submenu.style.visibility = '';
      return { width, height, topExpansion, leftExpansion, bottom: menuY + parent.offsetTop +
        Number.parseFloat(submenu.style.top) + height };
    }
    document.addEventListener('DOMContentLoaded', function () {
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        const cand = e.target instanceof Element ? e.target.closest('.cand') : null;
        if (!cand) return;
        currentRightClickedCand = cand;
        const menu = document.getElementById('contextMenu');
        const candidateOnly = cand.cloneNode(true);
        candidateOnly.querySelectorAll('.cand-translation').forEach((node) => node.remove());
        document.getElementById('menuDelete').style.display =
          Array.from((candidateOnly.textContent || '').replace(/^\s*\d+\s*/, '').trim()).length === 1 ? 'none' : 'block';
        const menuPosition=positionContextMenu(menu,e.clientX,e.clientY);
        const submenuSize=positionContextSubmenu(menu,menuPosition.y), content=document.getElementById('realContainer');
        window.chrome.webview.postMessage(serializeHostMessage({type:'contextMenuResize',data:{
          width:Math.ceil(menuPosition.x+menu.offsetWidth+submenuSize.width+4),
          height:Math.ceil(Math.max(content?.offsetHeight||0,menuPosition.y+menu.offsetHeight+4,submenuSize.bottom+4)),
          topExpansion:Math.ceil(Math.max(menuPosition.topExpansion||0,submenuSize.topExpansion||0))
          ,leftExpansion:Math.ceil(submenuSize.leftExpansion||0)
        }}));
      });
      // Dismiss only when clicking blank areas inside the rendered candidate card.
      document.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        if (!(e.target instanceof Element)) return;
        if (e.target.closest('.context-menu')) return;
        if (!e.target.closest('#realContainer')) return;
        hideContextMenu();
      });
      document.addEventListener('click', function (e) {
        if (e.button !== 0) {
          return;
        }

        if (!(e.target instanceof Element)) {
          return;
        }

        const candElement = e.target.closest('.cand');
        if (!candElement) {
          return;
        }

        const container = document.getElementById('realContainer');
        if (!container) {
          return;
        }
        const candidates = Array.from(container.querySelectorAll('.cand'));
        const candIndex = candidates.indexOf(candElement) + 1;
        if (candIndex <= 0) {
          return;
        }

        try {
          window.chrome.webview.postMessage(serializeHostMessage({ type: 'candidate', data: candIndex }));
        } catch (error) {
          console.error('Failed to send candidate click:', error);
        }
      });

      document.addEventListener('mousemove', function (event) {
        // Hover highlight is armed by the native host after GetCursorPos moves.
        lastPointerScreenPosition = { x: event.screenX, y: event.screenY };
        if (window.msimeCandidateDiagnostics === true && pointerProbeCount < 6) {
          pointerProbeCount += 1;
          window.chrome.webview.postMessage(serializeHostMessage({ type: 'candidatePointerProbe', data: {
            probe: pointerProbeCount, screenX: event.screenX, screenY: event.screenY,
            clientX: event.clientX, clientY: event.clientY,
            movementX: event.movementX, movementY: event.movementY,
            armed: document.documentElement.classList.contains('msime-hover-armed')
          }}));
        }
      });

      // Wheel paging. The page forwards a raw delta and nothing else: the notch
      // accumulator, the enable/disable setting and the page moves themselves all
      // live natively, shared with the D2D candidate window.
      document.addEventListener('wheel', function (event) {
        event.preventDefault();
        const menu = document.getElementById('contextMenu');
        if (menu && menu.style.display === 'block') {
          // Same as the D2D window: scrolling dismisses the menu and stops there.
          hideContextMenu();
          return;
        }
        // Chromium always fills wheelDeltaY, already in WHEEL_DELTA units
        // (±120 per notch), which is what the native accumulator expects.
        // deltaY is the standards fallback at 100 CSS px per notch.
        const raw = Number.isFinite(event.wheelDeltaY) ? event.wheelDeltaY : -event.deltaY * 1.2;
        const delta = Math.trunc(Math.max(-32768, Math.min(32767, raw)));
        if (delta === 0) return;
        window.chrome.webview.postMessage(serializeHostMessage({ type: 'candidateWheel', data: delta }));
      }, { passive: false });
    });
    function hideContextMenu() {
      const menu = document.getElementById('contextMenu');
      if (!menu || menu.style.display !== 'block') return;
      menu.style.display = 'none';
      currentRightClickedCand = null;
      window.RestoreContextMenuTopExpansion();
      window.chrome.webview.postMessage(serializeHostMessage({type:'contextMenuClosed'}));
    }
    function menuIndex(){ return Array.from(document.querySelectorAll('#realContainer .cand')).indexOf(currentRightClickedCand)+1; }
    function sendMenu(type,data){ window.chrome.webview.postMessage(serializeHostMessage({type,data}));
      hideContextMenu(); }
    function onPinToTop(e){ if(e.button===0) sendMenu('pin',menuIndex()); }
    function onDelete(e){ if(e.button===0) sendMenu('delete',menuIndex()); }
    function onFixPosition(e,position){ if(e.button===0) sendMenu('fixPosition',{index:menuIndex(),position}); }
    function onClearPosition(e){ if(e.button===0) sendMenu('clearPosition',menuIndex()); }

    window.ClearState = function () {
      lastPointerScreenPosition = null;
      pointerProbeCount = 0;
      const container = document.getElementById('realContainer');
      container.classList.remove('hover-active');
      hideContextMenu();
    }
    window.ApplyContextMenuTopExpansion = function (pixels) {
      const content = document.getElementById('realContainerParent');
      const menu = document.getElementById('contextMenu');
      const delta = pixels - contextMenuTopExpansion;
      content.style.marginTop = ((Number.parseFloat(content.style.marginTop) || 0) + delta) + 'px';
      menu.style.top = ((Number.parseFloat(menu.style.top) || 0) + delta) + 'px';
      contextMenuTopExpansion = pixels;
    }
    window.ApplyContextMenuLeftExpansion = function (pixels) {
      const content = document.getElementById('realContainerParent');
      const menu = document.getElementById('contextMenu');
      const delta = pixels - contextMenuLeftExpansion;
      content.style.marginLeft = ((Number.parseFloat(content.style.marginLeft) || 0) + delta) + 'px';
      menu.style.left = ((Number.parseFloat(menu.style.left) || 0) + delta) + 'px';
      contextMenuLeftExpansion = pixels;
    }
    window.RestoreContextMenuTopExpansion = function () {
      if (!contextMenuTopExpansion && !contextMenuLeftExpansion) return;
      const content = document.getElementById('realContainerParent');
      const menu = document.getElementById('contextMenu');
      content.style.marginTop = ((Number.parseFloat(content.style.marginTop) || 0) - contextMenuTopExpansion) + 'px';
      menu.style.top = ((Number.parseFloat(menu.style.top) || 0) - contextMenuTopExpansion) + 'px';
      contextMenuTopExpansion = 0;
      content.style.marginLeft = ((Number.parseFloat(content.style.marginLeft) || 0) - contextMenuLeftExpansion) + 'px';
      menu.style.left = ((Number.parseFloat(menu.style.left) || 0) - contextMenuLeftExpansion) + 'px';
      contextMenuLeftExpansion = 0;
    }

    window.SetCandidateSelection = function (index) {
      const candidates = document.querySelectorAll('#realContainer .cand');
      candidates.forEach((candidate) => candidate.classList.remove('first'));
      if (index >= 0 && index < candidates.length) {
        candidates[index].classList.add('first');
      }
    }

    window.SetCandidatePreeditVisible = function (visible) {
      const hide = !visible;
      document.getElementById('realContainer')?.classList.toggle('preedit-hidden', hide);
      document.getElementById('measureContainer')?.classList.toggle('preedit-hidden', hide);
    }

    window.SetPreeditCaret = function () {
      const preedit = document.querySelector('#realContainer .pinyin .text');
      if (!preedit) return;
      const marker = '\uE000';
      const text = preedit.textContent || '';
      const index = text.indexOf(marker);
      const cleanText = text.replace(marker, '');
      const caretIndex = index >= 0 ? index : cleanText.length;
      preedit.textContent = '';
      preedit.append(document.createTextNode(cleanText.slice(0, caretIndex)));
      const caret = document.createElement('span');
      caret.className = 'cursor';
      preedit.append(caret);
      preedit.append(document.createTextNode(cleanText.slice(caretIndex)));
    }

    window.ApplyCandidateFrame = function (payload) {
      const container = document.getElementById('realContainer');
      const parent = document.getElementById('realContainerParent');
      if (!container) return;
      if (window.ClearState) window.ClearState();
      if (parent) {
        if (payload.marginTop != null) parent.style.marginTop = payload.marginTop + 'px';
        if (payload.marginLeft != null) parent.style.marginLeft = payload.marginLeft + 'px';
      }
      if (window.SetCandidatePreeditVisible) {
        window.SetCandidatePreeditVisible(payload.preeditVisible !== false);
      }
      const preeditEl = container.querySelector('.pinyin .text');
      if (preeditEl) {
        preeditEl.textContent = payload.preedit || '';
        if (window.SetPreeditCaret) window.SetPreeditCaret();
      }
      const items = Array.isArray(payload.items) ? payload.items : [];
      const wrappers = container.querySelectorAll('.row-wrapper');
      let lastVisible = -1;
      wrappers.forEach(function (wrapper, index) {
        if (index < items.length && String(items[index] || '')) lastVisible = index;
      });
      wrappers.forEach(function (wrapper, index) {
        const html = index < items.length ? String(items[index] || '') : '';
        wrapper.style.display = html ? '' : 'none';
        // Unused slots stay in the DOM, so :last-child cannot find the last shown one.
        wrapper.classList.toggle('last-visible', index === lastVisible);
        const cand = wrapper.querySelector('.cand');
        if (!cand) return;
        let slot = cand.querySelector('.cand-content');
        if (!slot) {
          const text = cand.querySelector('.text') || cand;
          slot = document.createElement('span');
          slot.className = 'cand-content';
          const num = text.querySelector('.num, .cand-no');
          if (num) {
            while (num.nextSibling) text.removeChild(num.nextSibling);
          }
          text.appendChild(slot);
        }
        slot.innerHTML = html;
      });
      if (window.SetCandidateSelection) {
        window.SetCandidateSelection(payload.selected || 0);
      }
      void container.offsetWidth;
      const rect = container.getBoundingClientRect();
      return {
        width: Math.max(rect.width, container.offsetWidth || 0) + 1,
        height: Math.max(rect.height, container.offsetHeight || 0) + 1
      };
    }
  </script>
</head>

<body>
  <div id="realBody">
    <div class="containerParent" id="realContainerParent">
      <div class="container" id="realContainer">
        <!--0Anchor-->
        <div class="row pinyin">
          <div class="text">ni'mf<span class="cursor"></span></div>
          <div class="hidden-pinyin">n</div>
        </div>

  <div id="measureBody" style="visibility: hidden;">
    <div class="containerParent" id="measureContainerParent">
      <div class="container" id="measureContainer">
        <!--0Anchor-->
        <div class="row pinyin">
          <div class="text">{0}</div>
          <div class="hidden-pinyin">n</div>
        </div>
        <!--1Anchor-->
        <div class="row-wrapper first-row-wrapper">
          <div class="row cand first">
            <div class="text"><span class="num">1</span>{1} 你</div>
          </div>
        </div>
        <!--2Anchor-->
        <div class="row-wrapper">
          <div class="row cand">
            <div class="text"><span class="num">2</span>{2} 我</div>

        </div>
        <!--3Anchor-->
        <div class="row-wrapper">
          <div class="row cand">
            <div class="text"><span class="num">3</span>{3} 什么</div>

        <!--4Anchor-->
        <div class="row-wrapper">
          <div class="row cand">
            <div class="text"><span class="num">4</span>{4} 量子</div>

        <div class="row-wrapper">

    </div>
  </div>
<div id="contextMenu" class="context-menu">
  <div class="context-menu-item" onmouseup="onPinToTop(event)">置顶</div>
  <div class="context-menu-item context-menu-parent">固定排位<div class="context-submenu">
    <div class="context-menu-item" onmouseup="onFixPosition(event,1)">第 1 位</div>
    <div class="context-menu-item" onmouseup="onFixPosition(event,2)">第 2 位</div>
    <div class="context-menu-item" onmouseup="onFixPosition(event,3)">第 3 位</div>
    <div class="context-menu-item" onmouseup="onFixPosition(event,4)">第 4 位</div>
    <div class="context-menu-item" onmouseup="onFixPosition(event,5)">第 5 位</div>
    <div class="context-menu-separator"></div><div class="context-menu-item" onmouseup="onClearPosition(event)">取消固定</div>
  </div></div>
  <div id="menuDelete" class="context-menu-item" onmouseup="onDelete(event)">删除</div>
</div>
<script>
(function () {
  var SURFACE = 'cand';
  var SELECTOR = '#realContainer';
  var COOLDOWN_MS = 450;
  var lastSent = 0;
  var pending = false;
  function el() { return document.querySelector(SELECTOR); }
  function truncated(node) {
    if (!node) return false;
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var r = node.getBoundingClientRect();
    var pad = 1.5;
    return node.scrollWidth > vw + pad || node.scrollHeight > vh + pad ||
      r.width > vw + pad || r.height > vh + pad ||
      r.right > vw + pad || r.bottom > vh + pad;
  }
  function report() {
    var node = el();
    if (!node || !truncated(node)) return;
    if (!window.chrome || !window.chrome.webview) return;
    var now = Date.now();
    if (now - lastSent < COOLDOWN_MS) return;
    lastSent = now;
    var r = node.getBoundingClientRect();
    window.chrome.webview.postMessage(serializeHostMessage({
      type: 'contentTruncated',
      data: {
        surface: SURFACE,
        width: Math.ceil(Math.max(r.width, node.scrollWidth || 0)),
        height: Math.ceil(Math.max(r.height, node.scrollHeight || 0)),
        viewportWidth: document.documentElement.clientWidth,
        viewportHeight: document.documentElement.clientHeight
      }
    }));
  }
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        pending = false;
        report();
      });
    });
  }
  window.CheckContentTruncation = schedule;
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  if (typeof ResizeObserver !== 'undefined') {
    var ro = new ResizeObserver(schedule);
    ro.observe(document.documentElement);
    var node = el();
    if (node) ro.observe(node);
  }
})();
</script>
